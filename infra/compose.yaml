name: omo-bot
services:
  db:
    image: postgres:17.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: omo
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d omo']
      interval: 5s
      retries: 20
  migrate:
    build: { context: .., dockerfile: infra/Dockerfile }
    command: [node, dist/migrate.js]
    environment:
      STORAGE_PROVIDER: postgres
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL}
    depends_on: { db: { condition: service_healthy } }
    restart: "no"
  bot:
    build: { context: .., dockerfile: infra/Dockerfile }
    command: [node, dist/bot/main.js]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      STORAGE_PROVIDER: postgres
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?Set DISCORD_GUILD_ID}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?Set DISCORD_BOT_TOKEN}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:?Set DASHBOARD_ORIGIN}
      OWNER_USER_IDS: ${OWNER_USER_IDS:?Set OWNER_USER_IDS}
      DASHBOARD_ADMIN_ROLE_IDS: ${DASHBOARD_ADMIN_ROLE_IDS:-}
      DASHBOARD_VIEWER_ROLE_IDS: ${DASHBOARD_VIEWER_ROLE_IDS:-}
      BOT_NAME: ${BOT_NAME:-OMO Bot}
      COMMUNITY_NAME: ${COMMUNITY_NAME:-GottaGacha}
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build: { context: .., dockerfile: infra/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      STORAGE_PROVIDER: postgres
      WEB_HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?Set DISCORD_GUILD_ID}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:?Set DISCORD_APPLICATION_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?Set DISCORD_CLIENT_SECRET}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?Set SESSION_ENCRYPTION_KEY}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:?Set DASHBOARD_ORIGIN}
      OWNER_USER_IDS: ${OWNER_USER_IDS:?Set OWNER_USER_IDS}
      DASHBOARD_ADMIN_ROLE_IDS: ${DASHBOARD_ADMIN_ROLE_IDS:-}
      DASHBOARD_VIEWER_ROLE_IDS: ${DASHBOARD_VIEWER_ROLE_IDS:-}
      BOT_NAME: ${BOT_NAME:-OMO Bot}
      COMMUNITY_NAME: ${COMMUNITY_NAME:-GottaGacha}
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment: { DASHBOARD_DOMAIN: '${DASHBOARD_DOMAIN:?Set DASHBOARD_DOMAIN}' }
    ports: ['80:80', '443:443']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy_data:/data', 'caddy_config:/config']
    depends_on: [web]
volumes:
  database:
  caddy_data:
  caddy_config:
