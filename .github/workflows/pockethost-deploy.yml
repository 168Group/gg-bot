name: Deploy PocketHost bundle
# Uploads infra/pocketbase hooks and migrations to a PocketHost instance over SFTP.
# Runs on demand from the Actions tab, and automatically when the bundle changes on main.
# Secrets: POCKETHOST_SSH_KEY (Ed25519 private key registered under Account → Keys, scoped to the instance),
#          POCKETHOST_EMAIL (account email, the SFTP username), POCKETHOST_INSTANCE (instance name, the SFTP folder).
# Restart the instance from the PocketHost dashboard afterwards so new migrations apply.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['infra/pocketbase/**', '.github/workflows/pockethost-deploy.yml']
permissions:
  contents: read
concurrency: pockethost-deploy
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key and host key
        env:
          SSH_KEY: ${{ secrets.POCKETHOST_SSH_KEY }}
        run: |
          test -n "$SSH_KEY" || { echo "Set the POCKETHOST_SSH_KEY secret."; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Rebuild the key from its base64 body so a paste that lost line breaks or gained CR characters still loads.
          body=$(printf '%s' "$SSH_KEY" | tr -d '\r' | sed -e 's/-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----//' | tr -d ' \n\t')
          printf '%s' "$SSH_KEY" | grep -q 'BEGIN OPENSSH PRIVATE KEY' || { echo "POCKETHOST_SSH_KEY must be the OpenSSH private key, including its BEGIN and END lines."; exit 1; }
          { echo '-----BEGIN OPENSSH PRIVATE KEY-----'; printf '%s' "$body" | fold -w 70; echo; echo '-----END OPENSSH PRIVATE KEY-----'; } > ~/.ssh/pockethost
          chmod 600 ~/.ssh/pockethost
          echo "Public key derived from the secret (must match the key registered in PocketHost):"
          ssh-keygen -y -f ~/.ssh/pockethost || { echo "The secret is not a valid private key. Paste it again from the original source."; exit 1; }
          ssh-keyscan -p 2222 ftp.pockethost.io >> ~/.ssh/known_hosts 2>/dev/null
      - name: Upload hooks and migrations
        env:
          PH_USER: ${{ secrets.POCKETHOST_EMAIL }}
          PH_INSTANCE: ${{ secrets.POCKETHOST_INSTANCE }}
        run: |
          test -n "$PH_USER" -a -n "$PH_INSTANCE" || { echo "Set the POCKETHOST_EMAIL and POCKETHOST_INSTANCE secrets."; exit 1; }
          cd infra/pocketbase
          sftp -P 2222 -i ~/.ssh/pockethost -o BatchMode=yes -b - "$PH_USER@ftp.pockethost.io" <<SFTP
          cd $PH_INSTANCE
          -mkdir pb_hooks
          -mkdir pb_migrations
          put pb_hooks/*.js pb_hooks/
          put pb_migrations/*.js pb_migrations/
          ls -l pb_hooks
          ls -l pb_migrations
          bye
          SFTP
          echo "Bundle uploaded. Restart the instance from the PocketHost dashboard to apply migrations."
